<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>我的試場</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/m2.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <h1>我的試場</h1>
      <label class="sort-wrap" for="sortMode">
        <span class="sort-label">排序</span>
        <select id="sortMode" aria-label="排序">
          <option value="input">加入順序</option>
          <option value="exam">考試時間（由近到遠）</option>
        </select>
      </label>
      <div class="overflow">
        <button type="button" class="btn-overflow" id="btnOverflow" aria-label="更多" aria-haspopup="menu" aria-expanded="false" aria-controls="overflowMenu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7"></circle>
            <circle cx="12" cy="12" r="1.7"></circle>
            <circle cx="12" cy="19" r="1.7"></circle>
          </svg>
        </button>
        <div class="overflow-menu" id="overflowMenu" role="menu" hidden>
          <button type="button" class="overflow-item" role="menuitem" id="menuInstall">安裝</button>
          <button type="button" class="overflow-item" role="menuitem" id="menuShare">分享</button>
        </div>
      </div>
    </header>

    <p class="action-toast" id="actionToast" role="status" aria-live="polite" hidden></p>

    <div class="install-tip" id="installTip" role="status">
      想離線／更快開啟？可加到主畫面，或分享連結俾同學。
      <div>
        <button type="button" class="tip-go" id="tipOpenHelp">了解點樣做</button>
        <button type="button" class="tip-dismiss" id="tipDismiss">暫時唔使</button>
      </div>
    </div>

    <div class="install-sheet" id="installSheet" aria-hidden="true">
      <div class="install-sheet-card" role="dialog" aria-labelledby="installTitle">
        <h2 id="installTitle">加到主畫面／分享</h2>
        <p><strong>我的試場</strong> — 預覽版連結：<br/><a id="shareUrlText" href="https://slapp-commits.github.io/dse-exam-centres/">slapp-commits.github.io/dse-exam-centres</a></p>
        <p><strong>iPhone／iPad（Safari）</strong></p>
        <ol>
          <li>用 Safari 打開上面連結</li>
          <li>撳底部分享掣 □↑</li>
          <li>揀「加至主畫面」→ 新增</li>
        </ol>
        <p><strong>Android（Chrome）</strong></p>
        <ol>
          <li>用 Chrome 打開連結</li>
          <li>選單 ⋮ →「加到主畫面」／「安裝應用程式」</li>
        </ol>
        <div class="install-actions">
          <button type="button" class="primary" id="btnShareApp">分享連結</button>
          <button type="button" id="btnCopyLink">複製連結</button>
          <button type="button" id="btnCloseInstall">關閉</button>
        </div>
      </div>
    </div>

    <div class="map-area" id="mapArea" aria-label="地圖">
      <div id="map" class="leaflet-map"></div>
    </div>

    <a class="fab" href="add.html" title="新增考試" aria-label="新增考試">+</a>

    <section class="drawer" id="drawer" data-state="mid" aria-label="考試列表">
      <div class="drawer-handle-zone" id="drawerHandle" role="slider" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-label="拖曳抽屜高度">
        <div class="drawer-handle" aria-hidden="true"></div>
      </div>
      <div class="drawer-title" id="drawerTitle" title="撳一下顯示全部試場">我的考試 <span class="drawer-count" id="drawerCount"></span></div>
      <div class="drawer-list" id="examList"></div>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data/sample.js"></script>
  <script src="js/storage.js"></script>
  <script>window.DSE_PLAUSIBLE_DOMAIN="";</script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
